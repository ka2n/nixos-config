aliases:
    open: browse
    pr-review-todo: >-
        !f() { gh search prs --owner monicle --review-requested @me
        --json repository,number,state,title,labels,updatedAt
        --template '{{range .}}{{tablerow (printf "%s#%v" .repository.nameWithOwner .number) .state .title (pluck "name" .labels | join ", ") (timeago .updatedAt)}}{{end}}{{tablerender}}'
        "$@" -- is:unmerged -author:app/renovate; }; f "$@"
version: "1"
